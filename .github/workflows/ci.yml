name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - name: MCP server imports
        run: python -c "import mcp_server.server"

  quickstart-commands-windows:
    # Führt die Befehle aus QUICKSTART.md auf einem echten Windows-Runner aus.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schritte 3-7 aus QUICKSTART.md
        shell: pwsh
        run: |
          python -m venv .venv
          if (-not (Test-Path .venv\Scripts\python.exe)) { throw "venv fehlt" }
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pytest
          $server = Start-Process -FilePath .venv\Scripts\python.exe -ArgumentList "-m","uvicorn","app.main:app" -PassThru
          $status = 0
          foreach ($i in 1..30) {
            try { $status = (Invoke-WebRequest http://127.0.0.1:8000/api/items -UseBasicParsing).StatusCode; break } catch { Start-Sleep -Seconds 1 }
          }
          $count = 0
          if ($status -eq 200) { $count = ((Invoke-WebRequest http://127.0.0.1:8000/api/items -UseBasicParsing).Content | ConvertFrom-Json).Count }
          Stop-Process -Id $server.Id -Force
          if ($status -ne 200 -or $count -ne 10) { throw "Website-Check fehlgeschlagen: Status $status, $count Geräte" }
          "Website OK: Status $status, $count Geräte"
